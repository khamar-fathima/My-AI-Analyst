name: Daily AI Brief

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST (GitHub may delay runs by a few minutes)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to commit seen.json back to the repo

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send the brief
        env:
          GEMINI_API_KEY: AQ.Ab8RN6LKjtR6YusSYTKUNERADTt6i8jUfXuGg9mx2cUDMDgAYg
          TELEGRAM_BOT_TOKEN: 8706867030:AAH9hyOpqziYzXZvLxBj_RnfvBbzIw29Tes

          TELEGRAM_CHAT_ID: 671345749
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py

      - name: Save seen cache (so tomorrow's brief has no repeats)
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen cache [skip ci]"
            git push
          fi